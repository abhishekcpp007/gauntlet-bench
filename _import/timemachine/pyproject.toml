[project]
name = "gauntlet-timemachine"
version = "0.1.0"
description = "Replay, rewind and branch AI agent runs recorded by gauntlet-sandbox, and browse them in a self-contained HTML viewer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abhishek", email = "akvikramaditya007cppcoder@gmail.com" }]
keywords = ["agents", "trajectories", "replay", "debugging", "docker", "llm"]
dependencies = ["gauntlet-sandbox @ git+https://github.com/abhishekcpp007/gauntlet-sandbox", "pydantic>=2.6"]

[project.scripts]
timemachine = "gauntlet_timemachine.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekcpp007/gauntlet-timemachine"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_timemachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the viewer is one long HTML/CSS/JS template string
"src/gauntlet_timemachine/viewer.py" = ["E501"]
