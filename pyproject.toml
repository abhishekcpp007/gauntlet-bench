[project]
name = "gauntlet"
version = "0.1.0"
description = "A coding agent score you can trust: fresh GitHub PRs that pass a leak scan, and a grader the agent can't fake."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abhishek", email = "akvikramaditya007cppcoder@gmail.com" }]
keywords = ["evaluation", "reward-hacking", "contamination", "swe-bench", "agents", "reinforcement-learning", "llm", "github", "vitest"]
dependencies = [
    "docker>=7.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    # the canary and the disguise have to read JavaScript and TypeScript test files to edit them
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
claude = ["anthropic>=2.3"]

[project.scripts]
gauntlet = "gauntlet.harness.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekcpp007/NEW_REPO"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon, and most of these also pull images or packages over the network",
    "live: hits the real GitHub API (opt in with GAUNTLET_LIVE=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/gauntlet/harness/report.py" = ["E501"]  # the inline HTML template
